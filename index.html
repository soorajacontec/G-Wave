<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-Wave</title>
<meta name="description" content="Live world news radio and newspaper headlines on a rotating globe, with live English translation and news audio.">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply saved theme + skin before first paint
  try {
    var t = localStorage.getItem('gr-theme'); if (t) document.documentElement.dataset.theme = t;
    var s = localStorage.getItem('gr-skin'); if (s) document.documentElement.dataset.skin = s;
    var lp = JSON.parse(localStorage.getItem('gw-layout') || '"auto"');
    var w = window.innerWidth, coarse = window.matchMedia('(pointer: coarse)').matches;
    var lay = lp === 'mobile' ? 'mobile' : lp === 'tab' ? 'tab' : (w <= 760 ? 'mobile' : (w <= 1180 && coarse) ? 'tab' : 'desktop');
    document.documentElement.classList.add('lay-' + lay);
  } catch (e) {}
</script>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div id="globe" class="globe" aria-label="Rotating globe of news radio stations"></div>

<header class="topbar">
  <a class="brand" href="./" aria-label="G-Wave home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <ellipse cx="16" cy="16" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".75"/>
      <path d="M7 16h18" stroke="currentColor" stroke-width="1.4" opacity=".75"/>
      <path d="M26.5 8.5a13 13 0 0 1 0 15M5.5 8.5a13 13 0 0 0 0 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">G-Wave</span>
  </a>
  <div class="onair" id="onairCount"><span class="dot"></span><span id="countText">Tuning in…</span></div>
  <div class="top-actions">
    <button class="icon-btn" id="installBtn" hidden aria-label="Install app" title="Install app">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 19h16" /></svg>
    </button>
    <div class="layout-wrap">
      <button class="icon-btn" id="layoutBtn" aria-haspopup="true" aria-expanded="false" aria-label="Layout: Auto" title="Layout">
        <span id="layoutIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="13" height="10" rx="1.5"/><rect x="15" y="9" width="6.5" height="11" rx="1.5"/><path d="M6 19h6"/></svg></span><span class="lay-badge" id="layoutBadge">A</span>
      </button>
      <div class="layout-menu" id="layoutMenu" role="menu" hidden>
        <p class="menu-label">Optimise layout for</p>
        <button class="layout-opt" role="menuitemradio" aria-checked="false" data-layout="auto"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="13" height="10" rx="1.5"/><rect x="15" y="9" width="6.5" height="11" rx="1.5"/><path d="M6 19h6"/></svg><span><b>Auto</b><small>Fits the screen you're on</small></span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button><button class="layout-opt" role="menuitemradio" aria-checked="false" data-layout="mobile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span><b>Mobile</b><small>One-hand layout, bottom sheet</small></span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button><button class="layout-opt" role="menuitemradio" aria-checked="false" data-layout="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3" width="17" height="18" rx="2.5"/><path d="M11 18h2"/></svg><span><b>Tab</b><small>Bigger touch targets, side panel</small></span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
      </div>
    </div>
    <button class="mode-toggle" id="modeBtn" role="switch" aria-checked="false" aria-label="News mode" title="Switch between Radio and News">
      <span class="mode-thumb" aria-hidden="true"></span>
      <span class="mode-opt opt-radio">
        <svg class="i-radio" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="9" width="18" height="11" rx="2.5"/><path d="M7 9 16 4"/><circle cx="15.5" cy="14.5" r="2.6"/><path d="M6.5 13h4M6.5 16h4"/>
          <path class="wave w1" d="M18.6 3.2a3.4 3.4 0 0 1 0 3.6"/><path class="wave w2" d="M20.6 1.8a6 6 0 0 1 0 6.4"/>
        </svg>
        <b>Radio</b>
      </span>
      <span class="mode-opt opt-news">
        <svg class="i-news" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5h13v13a1.5 1.5 0 0 0 1.5 1.5H6A2 2 0 0 1 4 18Z"/><path d="M17 9h2.5v9.5a1.5 1.5 0 0 1-3 0"/>
          <path class="ln l1" d="M7 9h7"/><path class="ln l2" d="M7 12.5h7"/><path class="ln l3" d="M7 16h4.5"/>
        </svg>
        <b>News</b>
      </span>
    </button>
    <div class="skin-wrap">
      <button class="icon-btn" id="skinBtn" aria-haspopup="true" aria-expanded="false" aria-label="Change colour skin" title="Colour skin">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.9-.6-1.3-.6-2.1 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.9 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7" r="1.2"/></svg>
      </button>
      <div class="skin-menu" id="skinMenu" role="menu" hidden>
        <p class="menu-label">Colour skin</p>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Light / dark">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<section class="hero" id="hero">
  <p class="eyebrow" id="heroEyebrow">World news radio, live</p>
  <h1 id="heroTitle">Spin the planet.<br>Hear the headlines.</h1>
  <p class="lede" id="heroLede">Tap any glowing point to tune in to a news station. Turn on CC for live English translation, then search any topic to see what was said in the last 3 hours.</p>
</section>

<aside class="panel" id="panel" aria-label="Stations">
  <button class="sheet-handle" id="sheetHandle" aria-label="Expand station list"><span></span></button>
  <div class="pane-radio" id="paneRadio">
  <div class="panel-head">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="search" placeholder="Search a news topic, station or country" autocomplete="off">
    </label>
    <div class="chips" id="regions" role="tablist" aria-label="Region">
      <button class="chip" data-region="all" aria-selected="true">All</button>
      <button class="chip" data-region="recent" aria-selected="false">Last 3h</button>
      <button class="chip" data-region="fav" aria-selected="false">★ Saved</button>
      <button class="chip" data-region="Europe" aria-selected="false">Europe</button>
      <button class="chip" data-region="Americas" aria-selected="false">Americas</button>
      <button class="chip" data-region="Asia" aria-selected="false">Asia</button>
      <button class="chip" data-region="Middle East" aria-selected="false">Middle East</button>
      <button class="chip" data-region="Africa" aria-selected="false">Africa</button>
      <button class="chip" data-region="Oceania" aria-selected="false">Oceania</button>
    </div>
  </div>
  <ul class="stations" id="stations" aria-live="polite"></ul>
  </div>

  <div class="pane-news" id="paneNews" hidden>
    <div class="panel-head">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="newsSearch" type="search" placeholder="Search headlines worldwide" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="chips" id="newsTopics" role="tablist" aria-label="Topic">
        <button class="chip" data-topic="top" aria-selected="true">Top</button>
        <button class="chip" data-topic="world" aria-selected="false">World</button>
        <button class="chip" data-topic="business" aria-selected="false">Business</button>
        <button class="chip" data-topic="tech" aria-selected="false">Tech</button>
        <button class="chip" data-topic="sports" aria-selected="false">Sports</button>
        <button class="chip" data-topic="health" aria-selected="false">Health</button>
        <button class="chip" data-topic="science" aria-selected="false">Science</button>
      </div>
      <div class="chips" id="newsRegions" role="tablist" aria-label="Region">
        <button class="chip" data-nregion="all" aria-selected="true">Everywhere</button>
        <button class="chip" data-nregion="Asia" aria-selected="false">Asia</button>
        <button class="chip" data-nregion="Middle East" aria-selected="false">Middle East</button>
        <button class="chip" data-nregion="Europe" aria-selected="false">Europe</button>
        <button class="chip" data-nregion="Americas" aria-selected="false">Americas</button>
        <button class="chip" data-nregion="Africa" aria-selected="false">Africa</button>
        <button class="chip" data-nregion="Oceania" aria-selected="false">Oceania</button>
      </div>
      <div class="news-tools">
        <label class="select">
          <span class="sr-only">Time window</span>
          <select id="newsSpan">
            <option value="1h">Last hour</option>
            <option value="3h" selected>Last 3 hours</option>
            <option value="24h">Last 24 hours</option>
          </select>
        </label>
        <button class="chip" id="newsEnglish" aria-pressed="true">English only</button>
        <button class="chip sources-btn" id="sourcesBtn" aria-expanded="false" aria-controls="sourcesPanel" title="News sources">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/></svg>
          Sources <span id="sourcesCount"></span>
        </button>
        <button class="bulletin-btn" id="bulletinBtn" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5Z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          <span>Play bulletin</span>
        </button>
      </div>
      <div class="news-filter" id="newsFilter" hidden></div>
    </div>
    <div class="sources-panel" id="sourcesPanel" hidden>
      <div class="sources-top"><b>News sources</b><button class="icon-btn" id="sourcesClose" aria-label="Close sources">✕</button></div>
      <div class="sources-body" id="sourcesBody"></div>
    </div>
    <ul class="stations news-list" id="newsList" aria-live="polite"></ul>
  </div>
</aside>

<div class="captions" id="captions" hidden aria-live="polite">
  <div class="cap-status" id="capStatus"></div>
  <div class="cap-lines" id="capLines"></div>
</div>

<footer class="player" id="player" hidden>
  <div class="np">
    <div class="np-art" id="npArt"></div>
    <div class="np-text">
      <div class="np-name" id="npName">—</div>
      <div class="np-meta" id="npMeta"></div>
    </div>
  </div>
  <div class="controls">
    <button class="icon-btn fav-btn" id="favBtn" aria-pressed="false" aria-label="Save station" title="Save station">
      <svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z"/></svg>
    </button>
    <button class="play-btn" id="playBtn" aria-label="Pause">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
      <span class="spinner" aria-hidden="true"></span>
    </button>
    <button class="cc-btn" id="ccBtn" aria-pressed="false" title="English subtitles">
      <span>CC</span><small>EN</small>
    </button>
    <label class="volume" title="Volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
    </label>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<audio id="audioCors" crossorigin="anonymous" preload="none"></audio>
<audio id="audioPlain" preload="none"></audio>

<script src="vendor/globe.gl.min.js"></script>
<script src="news-sources.js"></script>
<script src="app.js"></script>
</body>
</html>
